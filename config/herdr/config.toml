onboarding = false

[theme]
# Follow Ghostty's ANSI palette (now Catppuccin Mocha) instead of a built-in theme.
name = "terminal"

[keys]
# Match tmux: ctrl+\ as the prefix (ctrl+b is emacs backward-char, and we run `emacs -nw`).
prefix = 'ctrl+\'

[ui.toast]
# In-UI toasts (replaces the removed Claude Code notifier hooks).
delivery = "herdr"

[ui.toast.herdr]
# top-right to line up with macOS native notifications.
position = "top-right"

[ui]
agent_panel_sort = "spaces"
# Less chrome: no scrollbar column, no tab row until a second tab exists.
pane_scrollbars = false
hide_tab_bar_when_single_tab = true
# Catppuccin Mocha mauve instead of the default cyan accent.
accent = "#cba6f7"
